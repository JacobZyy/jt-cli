[workspace]
members = ["apps/jt", "crates/nlab-api"]
default-members = ["apps/jt", "crates/nlab-api"]
resolver = "3"

[workspace.metadata]
name = "jt-monorepo"

[workspace.package]
version = "1.10.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/JacobZyy/jt-cli"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cliclack = "0.5.4"
ignore = "0.4.25"
rand = "0.9.2"
rand_chacha = "0.9.0"
regex = "1.12.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
tree-sitter = "0.26.12"
tree-sitter-java = "0.23.5"
