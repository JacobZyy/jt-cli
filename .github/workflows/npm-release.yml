name: npm release

on:
  workflow_call:

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f yarn.lock || -f bun.lock || -f bun.lockb || -f deno.lock ]]; then
            echo "::error::Unsupported package manager lockfile"
            exit 1
          elif [[ -f package-lock.json && -f pnpm-lock.yaml ]]; then
            echo "::error::Expected exactly one supported lockfile"
            exit 1
          elif [[ -f package-lock.json ]]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"
          elif [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Expected package-lock.json or pnpm-lock.yaml"
            exit 1
          fi

      - name: Set up pnpm
        if: steps.package-manager.outputs.name == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        shell: bash
        run: |
          case "${{ steps.package-manager.outputs.name }}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
          esac

      - name: Test
        shell: bash
        run: |
          case "${{ steps.package-manager.outputs.name }}" in
            npm) npm test ;;
            pnpm) pnpm run test ;;
          esac

      - name: Build
        shell: bash
        run: |
          case "${{ steps.package-manager.outputs.name }}" in
            npm) npm run build ;;
            pnpm) pnpm run build ;;
          esac

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Store package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          overwrite: true

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          release-type: node
          token: ${{ github.token }}

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Restore package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish to npm
        shell: bash
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/npm-package/*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          npm publish "${packages[0]}" --ignore-scripts
