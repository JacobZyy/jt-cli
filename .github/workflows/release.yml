name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  nlab-api-binaries:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build nlab-api
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build --locked --release --package nlab-api --bin nlab-api --target "$TARGET"

      - name: Package and checksum
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          binary="target/$TARGET/release/nlab-api"
          test "$("$binary" --version)" = "nlab-api ${EXPECTED_VERSION#v}"
          cp "$binary" dist/nlab-api
          tar -C dist -czf "dist/nlab-api-$TARGET.tar.gz" nlab-api
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "nlab-api-$TARGET.tar.gz" > "nlab-api-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "nlab-api-$TARGET.tar.gz" > "nlab-api-$TARGET.tar.gz.sha256"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
        run: >-
          gh release upload "$TAG_NAME"
          "dist/nlab-api-$TARGET.tar.gz"
          "dist/nlab-api-$TARGET.tar.gz.sha256"
          --clobber

  nlab-api-ready:
    needs:
      - release
      - nlab-api-binaries
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish nlab-api readiness manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/nlab-api-manifest.json"
          version="${TAG_NAME#v}"
          cat > "$manifest" <<EOF
          {
            "schemaVersion": 1,
            "version": "$version",
            "tag": "$TAG_NAME",
            "targets": ["aarch64-apple-darwin"]
          }
          EOF
          gh release upload "$TAG_NAME" "$manifest" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
