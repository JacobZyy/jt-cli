name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust workspace
        run: cargo +stable fmt --all --check

      - name: Check workspaces
        run: pnpm check

      - name: Lint workspaces
        run: pnpm lint

      - name: Enforce Rust warnings
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspaces
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

      - name: Test standalone installer
        run: sh crates/nlab-api/tests/install.sh
