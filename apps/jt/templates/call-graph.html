<!doctype html>
<!-- generated by jt call-graph -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>jt call graph</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-muted: #f0f3f9;
      --text: #182230;
      --muted: #637083;
      --border: #d7deea;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --canvas-grid: rgba(84, 105, 135, 0.14);
      --shadow: 0 12px 30px rgba(29, 48, 79, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f141d;
      --panel: #171e29;
      --panel-muted: #202a39;
      --text: #edf3fb;
      --muted: #9ba9bb;
      --border: #354256;
      --accent: #7aa7ff;
      --accent-soft: #203a69;
      --danger: #ff9b91;
      --danger-soft: #522824;
      --canvas-grid: rgba(160, 181, 214, 0.13);
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f141d;
        --panel: #171e29;
        --panel-muted: #202a39;
        --text: #edf3fb;
        --muted: #9ba9bb;
        --border: #354256;
        --accent: #7aa7ff;
        --accent-soft: #203a69;
        --danger: #ff9b91;
        --danger-soft: #522824;
        --canvas-grid: rgba(160, 181, 214, 0.13);
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, input, select { font: inherit; }

    button, select, input {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
    }

    button, select { cursor: pointer; }

    button:hover, select:hover, input:focus {
      border-color: var(--accent);
    }

    button:focus-visible, select:focus-visible, input:focus-visible,
    canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 152px;
      margin-right: 4px;
    }

    .brand strong { font-size: 15px; letter-spacing: -0.01em; }
    .brand span { color: var(--muted); font-size: 11px; }

    .search {
      flex: 1 1 260px;
      min-width: 180px;
      height: 32px;
      padding: 0 10px;
    }

    .control {
      height: 32px;
      padding: 0 9px;
    }

    .toolbar button { height: 32px; padding: 0 10px; }

    .toolbar .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .toolbar .primary:hover { filter: brightness(1.08); }

    .toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .depth {
      width: 52px;
      height: 32px;
      padding: 0 6px;
    }

    .banner {
      display: none;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12px;
    }

    .banner.visible { display: block; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 316px;
      min-height: 0;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      background-color: var(--panel);
      background-image: radial-gradient(circle, var(--canvas-grid) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .canvas-hint {
      position: absolute;
      right: 12px;
      bottom: 10px;
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      color: var(--muted);
      font-size: 11px;
      pointer-events: none;
    }

    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--border);
      background: var(--panel);
    }

    .details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 13px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .details-header strong { font-size: 13px; }

    .details-body {
      min-height: 0;
      overflow: auto;
      padding: 13px 14px 20px;
    }

    .empty { color: var(--muted); }

    .node-title {
      margin: 0 0 3px;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.3;
    }

    .node-subtitle {
      margin: 0 0 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .facts {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 5px 8px;
      margin: 0 0 15px;
    }

    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; overflow-wrap: anywhere; }

    .section { margin-top: 15px; }
    .section h3 { margin: 0 0 7px; font-size: 12px; }

    .section ul {
      display: grid;
      gap: 4px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .link-button {
      display: block;
      width: 100%;
      padding: 5px 7px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: var(--panel-muted);
      color: var(--text);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .link-button:hover { border-color: var(--accent); }

    .location {
      padding: 5px 7px;
      border-radius: 5px;
      background: var(--panel-muted);
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; }
    .legend .function { background: #2563eb; }
    .legend .variable { background: #0f9f75; }
    .legend .class { background: #a855f7; }
    .legend .module { background: #e58b24; }
    .legend .other { background: #718096; }

    #diagnostics-panel {
      max-height: 150px;
      overflow: auto;
      margin: 0;
      padding: 9px 14px 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 780px) {
      body { overflow: auto; }
      .app { min-height: 100%; height: auto; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 65vh) auto; }
      .details { border-top: 1px solid var(--border); border-left: 0; }
      .canvas-hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar" role="toolbar" aria-label="Call graph controls">
      <div class="brand"><strong>jt call graph</strong><span id="stats">0 nodes · 0 edges</span></div>
      <label class="sr-only" for="search">Search graph</label>
      <input id="search" class="search" type="search" placeholder="Search name, FQN, or path" autocomplete="off">
      <label>Node <select id="kind" class="control" aria-label="Filter node kind"><option value="all">All kinds</option></select></label>
      <label>Edge <select id="edge-kind" class="control" aria-label="Filter edge kind"><option value="all">All edges</option></select></label>
      <label>Depth <input id="depth" class="depth" type="number" min="0" max="20" step="1" value="1" aria-label="Focus depth"></label>
      <button id="fit" class="primary" type="button">Fit</button>
      <button id="reset" type="button">Reset</button>
      <button id="theme" type="button">Theme</button>
    </div>
    <div id="banner" class="banner" role="status"></div>
    <div class="workspace">
      <div class="canvas-wrap">
        <canvas id="graph" tabindex="0" aria-label="Interactive call graph"></canvas>
        <div class="canvas-hint">Drag node · drag canvas · wheel zoom · click focus</div>
      </div>
      <aside class="details" aria-live="polite">
        <div class="details-header"><strong>Selection</strong><button id="clear" type="button">Clear</button></div>
        <div id="details" class="details-body"><p class="empty">Select a node to inspect callers, callees, and call locations.</p></div>
        <div class="legend">
          <span><i class="function"></i>function</span>
          <span><i class="variable"></i>variable</span>
          <span><i class="class"></i>class</span>
          <span><i class="module"></i>module</span>
          <span><i class="other"></i>other</span>
        </div>
        <details id="diagnostics-panel" class="section" hidden>
          <summary>Diagnostics</summary>
          <ul id="diagnostics"></ul>
        </details>
      </aside>
    </div>
  </div>

  <script>
    // Rust replaces this expression with one JSON object. Keep placeholder unique.
    const GRAPH_DATA = __JT_GRAPH_DATA__;

    const MAX_RENDER_NODES = 5000;
    const MAX_RENDER_EDGES = 12000;
    const canvas = document.getElementById("graph");
    const context = canvas.getContext("2d");
    const root = document.documentElement;
    const state = {
      nodes: [],
      edges: [],
      nodeById: new Map(),
      outgoing: new Map(),
      incoming: new Map(),
      visible: new Set(),
      initialVisible: new Set(),
      focus: new Set(),
      positions: new Map(),
      initialPositions: new Map(),
      selected: null,
      hovered: null,
      search: "",
      kind: "all",
      edgeKind: "all",
      depth: 1,
      camera: { x: 0, y: 0, scale: 1 },
      pointer: null,
      dpr: 1,
      width: 0,
      height: 0,
      renderNodeLimit: false,
      renderEdgeLimit: false
    };

    function asText(value, fallback) {
      if (value === null || value === undefined) return fallback || "";
      return String(value);
    }

    function firstValue(object, keys, fallback) {
      for (const key of keys) {
        if (object && object[key] !== null && object[key] !== undefined) return object[key];
      }
      return fallback;
    }

    function normalizeNode(value, index) {
      const item = value && typeof value === "object" ? value : {};
      const path = asText(firstValue(item, ["path", "file", "filePath"], ""), "");
      const name = asText(firstValue(item, ["name", "label", "symbol"], path || "node-" + index), "node-" + index);
      const id = asText(firstValue(item, ["id", "key"], path ? path + "::" + name : name + "::" + index), name + "::" + index);
      return {
        id,
        name,
        qualifiedName: asText(firstValue(item, ["qualifiedName", "qualified_name", "fqn"], name), name),
        path,
        line: firstValue(item, ["line", "startLine", "start_line"], null),
        column: firstValue(item, ["column", "startColumn", "start_column"], null),
        kind: asText(firstValue(item, ["kind", "type"], "other"), "other"),
        language: asText(firstValue(item, ["language", "lang"], ""), ""),
        visibility: asText(firstValue(item, ["visibility"], ""), ""),
        metadata: item
      };
    }

    function normalizeLocation(value) {
      if (typeof value === "string" || typeof value === "number") return asText(value, "");
      if (!value || typeof value !== "object") return "";
      const path = asText(firstValue(value, ["path", "file", "filePath"], ""), "");
      const line = firstValue(value, ["line", "startLine", "start_line"], null);
      const column = firstValue(value, ["column", "startColumn", "start_column"], null);
      const edge = asText(firstValue(value, ["edge", "kind"], ""), "");
      const position = line === null ? "" : ":" + asText(line, "") + (column === null ? "" : ":" + asText(column, ""));
      return (path + position + (edge ? " · " + edge : "")).trim();
    }

    function normalizeEdge(value, index) {
      const item = value && typeof value === "object" ? value : {};
      const source = endpointText(firstValue(item, ["source", "sourceId", "source_id", "from", "caller", "callerId", "caller_id", "callerNodeId", "caller_node_id"], ""));
      const target = endpointText(firstValue(item, ["target", "targetId", "target_id", "to", "callee", "calleeId", "callee_id", "calleeNodeId", "callee_node_id"], ""));
      const locationValues = firstValue(item, ["locations", "callLocations", "call_locations", "sites", "calls"], []);
      const locations = Array.isArray(locationValues) ? locationValues.map(normalizeLocation).filter(Boolean) : [normalizeLocation(locationValues)].filter(Boolean);
      return {
        id: asText(firstValue(item, ["id", "key"], source + "->" + target + "::" + index), source + "->" + target + "::" + index),
        source,
        target,
        kind: asText(firstValue(item, ["kind", "type", "edgeKind", "edge_kind"], "calls"), "calls"),
        confidence: asText(firstValue(item, ["confidence"], "exact"), "exact"),
        count: Number(firstValue(item, ["count"], locations.length || 1)),
        locations,
        metadata: item
      };
    }

    function endpointText(value) {
      if (value && typeof value === "object") return asText(firstValue(value, ["id", "key"], ""), "");
      return asText(value, "");
    }

    function normalizeData(value) {
      const rootValue = value && typeof value === "object" && !Array.isArray(value) ? value : {};
      const object = Array.isArray(rootValue.nodes) || Array.isArray(rootValue.edges) ? rootValue : (rootValue.graph || rootValue.data || {});
      const rawNodes = Array.isArray(object.nodes) ? object.nodes : [];
      const rawEdges = Array.isArray(object.edges) ? object.edges : Array.isArray(object.links) ? object.links : [];
      const nodes = rawNodes.map(normalizeNode).sort((left, right) => compareText(left.id, right.id));
      const known = new Set(nodes.map((node) => node.id));
      const edges = rawEdges.map(normalizeEdge).filter((edge) => known.has(edge.source) && known.has(edge.target)).sort((left, right) => {
        return compareText(left.source + "\u0000" + left.target + "\u0000" + left.kind + "\u0000" + left.id, right.source + "\u0000" + right.target + "\u0000" + right.kind + "\u0000" + right.id);
      });
      return { nodes, edges, source: rootValue };
    }

    function uniqueSorted(values) {
      return [...new Set(values)].sort(compareText);
    }

    function compareText(left, right) {
      left = asText(left, "");
      right = asText(right, "");
      return left < right ? -1 : left > right ? 1 : 0;
    }

    function populateSelect(element, values, allLabel) {
      while (element.firstChild) element.removeChild(element.firstChild);
      const all = document.createElement("option");
      all.value = "all";
      all.textContent = allLabel;
      element.appendChild(all);
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        element.appendChild(option);
      }
    }

    function makeGraph() {
      const normalized = normalizeData(GRAPH_DATA);
      state.nodes = normalized.nodes;
      state.edges = normalized.edges;
      state.depth = Math.max(0, Math.min(20, Number.parseInt(normalized.source.depth, 10) || 1));
      document.getElementById("depth").value = String(state.depth);
      state.nodeById = new Map(state.nodes.map((node) => [node.id, node]));
      const initialIds = Array.isArray(normalized.source.initialNodes) ? normalized.source.initialNodes : state.nodes.map((node) => node.id);
      state.initialVisible = new Set(initialIds.filter((id) => state.nodeById.has(id)));
      state.outgoing = new Map(state.nodes.map((node) => [node.id, []]));
      state.incoming = new Map(state.nodes.map((node) => [node.id, []]));
      for (const edge of state.edges) {
        state.outgoing.get(edge.source).push(edge);
        state.incoming.get(edge.target).push(edge);
      }
      for (const list of state.outgoing.values()) list.sort(compareEdges);
      for (const list of state.incoming.values()) list.sort(compareEdges);
      populateSelect(document.getElementById("kind"), uniqueSorted(state.nodes.map((node) => node.kind)), "All kinds");
      populateSelect(document.getElementById("edge-kind"), uniqueSorted(state.edges.map((edge) => edge.kind)), "All edges");
      layoutNodes();
      if (normalized.source.focus && state.nodeById.has(normalized.source.focus)) {
        state.selected = normalized.source.focus;
      }
      updateLimits(normalized.source);
      renderDiagnostics(normalized.source);
      updateFilters();
      updateStats();
      fitView();
      updateDetails();
    }

    function compareEdges(left, right) {
      return compareText(left.target + "\u0000" + left.kind + "\u0000" + left.id, right.target + "\u0000" + right.kind + "\u0000" + right.id);
    }

    function layoutNodes() {
      const incomingCount = new Map(state.nodes.map((node) => [node.id, 0]));
      for (const edge of state.edges) incomingCount.set(edge.target, incomingCount.get(edge.target) + 1);
      const level = new Map();
      const queue = state.nodes.filter((node) => incomingCount.get(node.id) === 0).sort(compareNodes);
      if (queue.length === 0 && state.nodes.length > 0) queue.push(state.nodes[0]);
      for (const node of queue) level.set(node.id, 0);
      let cursor = 0;
      while (cursor < queue.length) {
        const source = queue[cursor++];
        const sourceLevel = level.get(source.id) || 0;
        for (const edge of state.outgoing.get(source.id) || []) {
          const nextLevel = sourceLevel + 1;
          if (!level.has(edge.target) || nextLevel < level.get(edge.target)) {
            level.set(edge.target, nextLevel);
            queue.push(state.nodeById.get(edge.target));
          }
        }
      }
      for (const node of state.nodes) {
        if (level.has(node.id)) continue;
        level.set(node.id, 0);
        queue.push(node);
      }
      const groups = new Map();
      for (const node of state.nodes) {
        const group = groups.get(level.get(node.id)) || [];
        group.push(node);
        groups.set(level.get(node.id), group);
      }
      const positions = new Map();
      const sortedLevels = [...groups.keys()].sort((left, right) => left - right);
      for (const currentLevel of sortedLevels) {
        const group = groups.get(currentLevel).sort(compareNodes);
        group.forEach((node, index) => {
          positions.set(node.id, {
            x: currentLevel * 240,
            y: (index - (group.length - 1) / 2) * 92
          });
        });
      }
      state.positions = positions;
      state.initialPositions = new Map([...positions].map(([id, point]) => [id, { x: point.x, y: point.y }]));
    }

    function compareNodes(left, right) {
      return compareText(left.path + "\u0000" + left.name + "\u0000" + left.id, right.path + "\u0000" + right.name + "\u0000" + right.id);
    }

    function updateLimits(source) {
      const meta = source && typeof source.meta === "object" ? source.meta : source && typeof source.metadata === "object" ? source.metadata : {};
      const truncated = Boolean(firstValue(source, ["truncated", "isTruncated", "is_truncated"], false) || firstValue(meta, ["truncated", "isTruncated", "is_truncated"], false));
      const limit = firstValue(source, ["limit", "maxNodes", "max_nodes"], firstValue(meta, ["limit", "maxNodes", "max_nodes"], null));
      const totalNodes = firstValue(source, ["totalNodes", "total_nodes"], firstValue(meta, ["totalNodes", "total_nodes"], null));
      const totalEdges = firstValue(source, ["totalEdges", "total_edges"], firstValue(meta, ["totalEdges", "total_edges"], null));
      const banner = document.getElementById("banner");
      if (truncated || (limit !== null && ((totalNodes !== null && totalNodes > state.nodes.length) || (totalEdges !== null && totalEdges > state.edges.length)))) {
        const shown = state.initialVisible.size + " initial nodes from " + state.nodes.length + " embedded nodes";
        const suffix = limit === null ? "" : " (limit " + asText(limit, "") + ")";
        banner.textContent = "Initial view limited: " + shown + suffix + ". Search and focus still use the complete embedded graph.";
        banner.classList.add("visible");
      }
    }

    function renderDiagnostics(source) {
      const diagnostics = Array.isArray(source.diagnostics) ? source.diagnostics : [];
      const panel = document.getElementById("diagnostics-panel");
      const list = document.getElementById("diagnostics");
      clearElement(list);
      panel.hidden = diagnostics.length === 0;
      if (diagnostics.length === 0) return;
      panel.querySelector("summary").textContent = "Diagnostics (" + diagnostics.length + ")";
      for (const diagnostic of diagnostics) {
        const item = document.createElement("li");
        const location = diagnostic.path ? diagnostic.path + (diagnostic.line ? ":" + diagnostic.line : "") + " · " : "";
        item.textContent = location + asText(diagnostic.code, "diagnostic") + " · " + asText(diagnostic.message, "");
        list.appendChild(item);
      }
    }

    function updateStats() {
      const stats = document.getElementById("stats");
      stats.textContent = state.nodes.length + " nodes · " + state.edges.length + " edges";
    }

    function nodeMatches(node, useInitial, ignoreSearch) {
      if (!node) return false;
      if (state.kind !== "all" && node.kind !== state.kind) return false;
      if (ignoreSearch) return true;
      if (!state.search) return !useInitial || state.kind !== "all" || state.initialVisible.has(node.id);
      const query = state.search.toLowerCase();
      return (node.name + "\n" + node.qualifiedName + "\n" + node.path).toLowerCase().includes(query);
    }

    function edgeMatches(edge) {
      return state.edgeKind === "all" || edge.kind === state.edgeKind;
    }

    function focusEdgeMatches(edge) {
      if (state.edgeKind !== "all") return edge.kind === state.edgeKind;
      const selected = state.nodeById.get(state.selected);
      return selected && selected.kind === "file"
        ? true
        : edge.kind === "calls" || edge.kind === "instantiates";
    }

    function updateFilters() {
      if (state.selected && !nodeMatches(state.nodeById.get(state.selected), false)) state.selected = null;
      updateFocus();
      state.visible = state.selected
        ? new Set([...state.focus].filter((id) => nodeMatches(state.nodeById.get(id), false, true)))
        : new Set(state.nodes.filter((node) => nodeMatches(node, true)).map((node) => node.id));
      updateDetails();
      draw();
    }

    function updateFocus() {
      if (!state.selected) {
        state.focus = new Set();
        return;
      }
      const focus = new Set([state.selected]);
      const queue = [{ id: state.selected, distance: 0 }];
      while (queue.length > 0) {
        const current = queue.shift();
        if (current.distance >= state.depth) continue;
        const adjacent = [];
        for (const edge of state.outgoing.get(current.id) || []) if (focusEdgeMatches(edge)) adjacent.push(edge.target);
        for (const edge of state.incoming.get(current.id) || []) if (focusEdgeMatches(edge)) adjacent.push(edge.source);
        for (const id of adjacent.sort(compareText)) {
          if (focus.has(id)) continue;
          focus.add(id);
          queue.push({ id, distance: current.distance + 1 });
        }
      }
      state.focus = focus;
    }

    function colorFor(kind) {
      const palette = {
        function: "#2563eb",
        method: "#2563eb",
        variable: "#0f9f75",
        constant: "#0f9f75",
        class: "#a855f7",
        interface: "#a855f7",
        module: "#e58b24",
        file: "#e58b24",
        namespace: "#e58b24",
        type: "#c24178",
        enum: "#c24178"
      };
      return palette[kind] || "#718096";
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      state.width = Math.max(1, rect.width);
      state.height = Math.max(1, rect.height);
      canvas.width = Math.round(state.width * state.dpr);
      canvas.height = Math.round(state.height * state.dpr);
      fitView();
    }

    function worldToScreen(point) {
      return {
        x: point.x * state.camera.scale + state.camera.x,
        y: point.y * state.camera.scale + state.camera.y
      };
    }

    function screenToWorld(point) {
      return {
        x: (point.x - state.camera.x) / state.camera.scale,
        y: (point.y - state.camera.y) / state.camera.scale
      };
    }

    function fitView() {
      if (!state.width || !state.height || state.positions.size === 0) {
        state.camera = { x: state.width / 2, y: state.height / 2, scale: 1 };
        draw();
        return;
      }
      const nodes = state.nodes.filter((node) => state.visible.size === 0 || state.visible.has(node.id));
      const points = (nodes.length ? nodes : state.nodes).map((node) => state.positions.get(node.id));
      const minX = Math.min(...points.map((point) => point.x));
      const maxX = Math.max(...points.map((point) => point.x));
      const minY = Math.min(...points.map((point) => point.y));
      const maxY = Math.max(...points.map((point) => point.y));
      const spanX = Math.max(240, maxX - minX + 160);
      const spanY = Math.max(180, maxY - minY + 120);
      const scale = Math.max(0.08, Math.min(3, Math.min((state.width - 56) / spanX, (state.height - 56) / spanY)));
      state.camera = {
        scale,
        x: state.width / 2 - (minX + maxX) * scale / 2,
        y: state.height / 2 - (minY + maxY) * scale / 2
      };
      draw();
    }

    function resetView() {
      state.positions = new Map([...state.initialPositions].map(([id, point]) => [id, { x: point.x, y: point.y }]));
      state.selected = null;
      state.hovered = null;
      state.search = "";
      state.kind = "all";
      state.edgeKind = "all";
      document.getElementById("search").value = "";
      document.getElementById("kind").value = "all";
      document.getElementById("edge-kind").value = "all";
      updateFilters();
      fitView();
    }

    function draw() {
      if (!context) return;
      context.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      context.clearRect(0, 0, state.width, state.height);
      const visibleNodes = state.nodes.filter((node) => state.visible.has(node.id));
      const nodeLimit = visibleNodes.length > MAX_RENDER_NODES;
      const nodesToDraw = nodeLimit ? visibleNodes.slice(0, MAX_RENDER_NODES) : visibleNodes;
      const drawn = new Set(nodesToDraw.map((node) => node.id));
      const visibleEdges = state.edges.filter((edge) => edgeMatches(edge) && drawn.has(edge.source) && drawn.has(edge.target));
      const edgeLimit = visibleEdges.length > MAX_RENDER_EDGES;
      const edgesToDraw = edgeLimit ? visibleEdges.slice(0, MAX_RENDER_EDGES) : visibleEdges;
      state.renderNodeLimit = nodeLimit;
      state.renderEdgeLimit = edgeLimit;
      drawEdges(edgesToDraw);
      for (const node of nodesToDraw) drawNode(node);
      if (nodeLimit || edgeLimit) {
        const banner = document.getElementById("banner");
        banner.textContent = "Graph view truncated for browser performance: showing " + nodesToDraw.length + " of " + visibleNodes.length + " nodes and " + edgesToDraw.length + " of " + visibleEdges.length + " edges.";
        banner.classList.add("visible");
      }
    }

    function isEmphasized(id) {
      if (state.hovered) return id === state.hovered || neighborsOf(state.hovered).has(id);
      if (state.selected) return state.focus.has(id);
      return true;
    }

    function neighborsOf(id) {
      const neighbors = new Set();
      for (const edge of state.outgoing.get(id) || []) neighbors.add(edge.target);
      for (const edge of state.incoming.get(id) || []) neighbors.add(edge.source);
      return neighbors;
    }

    function drawEdges(edges) {
      for (const edge of edges) {
        const source = state.positions.get(edge.source);
        const target = state.positions.get(edge.target);
        if (!source || !target) continue;
        const start = worldToScreen(source);
        const end = worldToScreen(target);
        const related = state.hovered && (edge.source === state.hovered || edge.target === state.hovered);
        const focused = state.selected && state.focus.has(edge.source) && state.focus.has(edge.target);
        const alpha = state.hovered ? (related ? 0.9 : 0.1) : state.selected ? (focused ? 0.85 : 0.12) : 0.48;
        context.save();
        context.globalAlpha = alpha;
        context.strokeStyle = edge.kind === "calls" ? "#64748b" : colorFor(edge.kind);
        context.fillStyle = context.strokeStyle;
        context.lineWidth = related || focused ? 2 : 1;
        if (edge.confidence !== "exact") context.setLineDash([6, 4]);
        if (edge.source === edge.target) {
          const radius = Math.max(15, 22 * state.camera.scale);
          context.beginPath();
          context.arc(start.x, start.y - radius / 2, radius, 0.25, Math.PI * 1.85);
          context.stroke();
          arrowHead(start.x + radius * 0.2, start.y - radius * 1.35, 0.2, 5);
        } else {
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(end.x, end.y);
          context.stroke();
          arrowHead(end.x, end.y, Math.atan2(end.y - start.y, end.x - start.x), 5);
        }
        context.restore();
      }
    }

    function arrowHead(x, y, angle, size) {
      context.save();
      context.translate(x, y);
      context.rotate(angle);
      context.beginPath();
      context.moveTo(0, 0);
      context.lineTo(-size, size * 0.55);
      context.lineTo(-size, -size * 0.55);
      context.closePath();
      context.fill();
      context.restore();
    }

    function drawNode(node) {
      const position = state.positions.get(node.id);
      if (!position) return;
      const point = worldToScreen(position);
      const selected = state.selected === node.id;
      const hovered = state.hovered === node.id;
      const emphasized = isEmphasized(node.id);
      const radius = selected || hovered ? 10 : 8;
      context.save();
      context.globalAlpha = emphasized ? 1 : 0.16;
      context.fillStyle = colorFor(node.kind);
      context.strokeStyle = selected ? getComputedStyle(root).getPropertyValue("--text") : "rgba(255,255,255,0.8)";
      context.lineWidth = selected ? 3 : 1.2;
      if (["file", "module", "namespace"].includes(node.kind)) {
        context.beginPath();
        context.roundRect(point.x - radius, point.y - radius, radius * 2, radius * 2, 3);
        context.fill();
        context.stroke();
      } else {
        context.beginPath();
        context.arc(point.x, point.y, radius, 0, Math.PI * 2);
        context.fill();
        context.stroke();
      }
      const showLabel = state.camera.scale > 0.42 || selected || hovered;
      if (showLabel) {
        context.font = selected ? "600 12px ui-sans-serif, sans-serif" : "12px ui-sans-serif, sans-serif";
        context.fillStyle = getComputedStyle(root).getPropertyValue("--text");
        context.textBaseline = "middle";
        context.globalAlpha = emphasized ? 1 : 0.18;
        context.fillText(shortLabel(node), point.x + radius + 5, point.y);
      }
      context.restore();
    }

    function shortLabel(node) {
      const label = node.name || node.qualifiedName || node.path || node.id;
      return label.length > 46 ? label.slice(0, 43) + "..." : label;
    }

    function pointerPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function hitNode(point) {
      const world = screenToWorld(point);
      let result = null;
      let distance = Infinity;
      for (const node of state.nodes) {
        if (!state.visible.has(node.id)) continue;
        const position = state.positions.get(node.id);
        const dx = position.x - world.x;
        const dy = position.y - world.y;
        const current = Math.hypot(dx, dy);
        const radius = Math.max(12, 13 / state.camera.scale);
        if (current <= radius && current < distance) {
          result = node.id;
          distance = current;
        }
      }
      return result;
    }

    function selectNode(id) {
      state.selected = id;
      state.hovered = null;
      updateFilters();
    }

    function nodeLocation(node) {
      if (!node.path) return "";
      return node.path + (node.line === null || node.line === undefined ? "" : ":" + node.line) + (node.column === null || node.column === undefined ? "" : ":" + node.column);
    }

    function clearElement(element) {
      while (element.firstChild) element.removeChild(element.firstChild);
    }

    function addDetailText(parent, value, className) {
      const element = document.createElement("div");
      if (className) element.className = className;
      element.textContent = asText(value, "");
      parent.appendChild(element);
      return element;
    }

    function addNodeList(parent, title, ids) {
      const section = document.createElement("section");
      section.className = "section";
      const heading = document.createElement("h3");
      heading.textContent = title + " (" + ids.length + ")";
      section.appendChild(heading);
      if (ids.length === 0) {
        addDetailText(section, "None", "empty");
      } else {
        const list = document.createElement("ul");
        for (const id of ids) {
          const node = state.nodeById.get(id);
          if (!node) continue;
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "link-button";
          button.textContent = node.name + (node.path ? " · " + node.path : "");
          button.addEventListener("click", () => selectNode(node.id));
          item.appendChild(button);
          list.appendChild(item);
        }
        section.appendChild(list);
      }
      parent.appendChild(section);
    }

    function edgeNodeIds(edges, field) {
      return [...new Set(edges.map((edge) => edge[field]))].filter((id) => state.nodeById.has(id)).sort((left, right) => {
        const leftNode = state.nodeById.get(left);
        const rightNode = state.nodeById.get(right);
        return compareNodes(leftNode, rightNode);
      });
    }

    function addLocations(parent, edges) {
      const locations = [];
      for (const edge of edges) {
        const prefix = edge.kind + " · " + edge.confidence + " · " + edge.count + "x · ";
        for (const location of edge.locations) locations.push(prefix + location);
        if (edge.locations.length === 0) locations.push(prefix + edge.source + " -> " + edge.target);
      }
      const section = document.createElement("section");
      section.className = "section";
      const heading = document.createElement("h3");
      heading.textContent = "Call locations (" + locations.length + ")";
      section.appendChild(heading);
      if (locations.length === 0) {
        addDetailText(section, "None", "empty");
      } else {
        const list = document.createElement("ul");
        for (const location of locations.sort(compareText)) {
          const item = document.createElement("li");
          item.className = "location";
          item.textContent = location;
          list.appendChild(item);
        }
        section.appendChild(list);
      }
      parent.appendChild(section);
    }

    function updateDetails() {
      const panel = document.getElementById("details");
      clearElement(panel);
      if (!state.selected || !state.nodeById.has(state.selected)) {
        addDetailText(panel, "Select a node to inspect callers, callees, and call locations.", "empty");
        return;
      }
      const node = state.nodeById.get(state.selected);
      const incoming = (state.incoming.get(node.id) || []).filter(focusEdgeMatches);
      const outgoing = (state.outgoing.get(node.id) || []).filter(focusEdgeMatches);
      const callers = edgeNodeIds(incoming, "source");
      const callees = edgeNodeIds(outgoing, "target");
      const title = document.createElement("h2");
      title.className = "node-title";
      title.textContent = node.name;
      panel.appendChild(title);
      addDetailText(panel, node.qualifiedName, "node-subtitle");
      const facts = document.createElement("dl");
      facts.className = "facts";
      const values = [
        ["Kind", node.kind],
        ["Language", node.language || "Unknown"],
        ["Location", nodeLocation(node) || "Unknown"],
        ["ID", node.id]
      ];
      for (const [label, value] of values) {
        const term = document.createElement("dt");
        term.textContent = label;
        const detail = document.createElement("dd");
        detail.textContent = asText(value, "");
        facts.appendChild(term);
        facts.appendChild(detail);
      }
      panel.appendChild(facts);
      addNodeList(panel, "Callers", callers);
      addNodeList(panel, "Callees", callees);
      addLocations(panel, [...incoming, ...outgoing]);
    }

    function zoomAt(point, factor) {
      const before = screenToWorld(point);
      state.camera.scale = Math.max(0.08, Math.min(6, state.camera.scale * factor));
      const after = worldToScreen(before);
      state.camera.x += point.x - after.x;
      state.camera.y += point.y - after.y;
      draw();
    }

    canvas.addEventListener("pointerdown", (event) => {
      const point = pointerPoint(event);
      const node = hitNode(point);
      state.pointer = {
        id: event.pointerId,
        start: point,
        last: point,
        node,
        moved: false
      };
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add("dragging");
    });

    canvas.addEventListener("pointermove", (event) => {
      const point = pointerPoint(event);
      if (state.pointer && state.pointer.id === event.pointerId) {
        const previous = state.pointer.last;
        const dx = point.x - previous.x;
        const dy = point.y - previous.y;
        if (Math.hypot(point.x - state.pointer.start.x, point.y - state.pointer.start.y) > 3) state.pointer.moved = true;
        if (state.pointer.node) {
          const position = state.positions.get(state.pointer.node);
          position.x += dx / state.camera.scale;
          position.y += dy / state.camera.scale;
        } else {
          state.camera.x += dx;
          state.camera.y += dy;
        }
        state.pointer.last = point;
        draw();
        return;
      }
      const hovered = hitNode(point);
      if (hovered !== state.hovered) {
        state.hovered = hovered;
        draw();
      }
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!state.pointer || state.pointer.id !== event.pointerId) return;
      const pointer = state.pointer;
      state.pointer = null;
      canvas.classList.remove("dragging");
      if (!pointer.moved && pointer.node) selectNode(pointer.node);
    });

    canvas.addEventListener("pointercancel", () => {
      state.pointer = null;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("pointerleave", () => {
      if (!state.pointer && state.hovered) {
        state.hovered = null;
        draw();
      }
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(pointerPoint(event), event.deltaY < 0 ? 1.12 : 0.89);
    }, { passive: false });

    document.getElementById("search").addEventListener("input", (event) => {
      state.search = event.target.value.trim();
      updateFilters();
    });
    document.getElementById("kind").addEventListener("change", (event) => {
      state.kind = event.target.value;
      updateFilters();
    });
    document.getElementById("edge-kind").addEventListener("change", (event) => {
      state.edgeKind = event.target.value;
      updateFilters();
    });
    document.getElementById("depth").addEventListener("change", (event) => {
      const value = Number.parseInt(event.target.value, 10);
      state.depth = Number.isFinite(value) ? Math.max(0, Math.min(20, value)) : 1;
      event.target.value = String(state.depth);
      updateFilters();
    });
    document.getElementById("fit").addEventListener("click", fitView);
    document.getElementById("reset").addEventListener("click", resetView);
    document.getElementById("clear").addEventListener("click", () => {
      state.selected = null;
      state.hovered = null;
      updateFilters();
    });
    document.getElementById("theme").addEventListener("click", () => {
      const current = root.getAttribute("data-theme");
      root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
      draw();
    });
    window.addEventListener("resize", resizeCanvas);

    makeGraph();
    resizeCanvas();
  </script>
</body>
</html>
